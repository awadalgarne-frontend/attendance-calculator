<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاسبة التأخر والانصراف المبكر</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #74ebd5, #ACB6E5);
      font-family: "Tahoma", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      width: 400px;
    }

    .btn-primary {
      background-color: #0078d7;
      border: none;
    }

    .btn-primary:hover {
      background-color: #005fa3;
    }

    .result-box {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
      line-height: 1.8;
      display: none;
      font-weight: 500;
    }

    h2 {
      color: #333;
    }

  </style>
</head>
<body>

  <div class="card p-4 text-center">
    <h2 class="mb-4">🕒 حاسبة التأخر والانصراف المبكر</h2>
    <form id="attendanceForm">
      
      <div class="mb-3">
        <label for="shift" class="form-label fw-bold">نوع الدوام</label>
        <select id="shift" class="form-select">
          <option value="summer">الدوام الصيفي</option>
          <option value="winter">الدوام الشتوي</option>
        </select>
      </div>

      <div class="mb-3 text-start">
        <label class="form-label fw-bold">زمن الحضور</label>
        <input type="time" id="arrival" class="form-control">
      </div>

      <div class="mb-3 text-start">
        <label class="form-label fw-bold">زمن الانصراف</label>
        <input type="time" id="departure" class="form-control">
      </div>

      <button type="submit" class="btn btn-primary w-100">حساب النتيجة</button>

      <div id="result" class="result-box text-end mt-3"></div>
    </form>
  </div>

  <script>
    document.getElementById('attendanceForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const shift = document.getElementById('shift').value;
      const arrival = document.getElementById('arrival').value;
      const departure = document.getElementById('departure').value;
      const resultDiv = document.getElementById('result');

      if (!arrival || !departure) {
        resultDiv.style.display = 'block';
        resultDiv.style.background = '#ffe5e5';
        resultDiv.style.color = '#b30000';
        resultDiv.innerHTML = "⚠️ الرجاء إدخال زمن الحضور والانصراف.";
        return;
      }

      // الأوقات الرسمية
      let startTime, endTime;
      if (shift === 'summer') {
        startTime = "06:45";
        endTime = "13:15";
      } else {
        startTime = "07:15";
        endTime = "13:45";
      }

      // تحويل الوقت إلى دقائق
      function toMinutes(time) {
        const [h, m] = time.split(':').map(Number);
        return h * 60 + m;
      }

      const officialStart = toMinutes(startTime);
      const officialEnd = toMinutes(endTime);
      const actualStart = toMinutes(arrival);
      const actualEnd = toMinutes(departure);

      // حساب الدقائق
      const lateMinutes = Math.max(0, actualStart - officialStart);
      const earlyLeaveMinutes = Math.max(0, officialEnd - actualEnd);
      const totalMinutes = lateMinutes + earlyLeaveMinutes;

      // تحويل الدقائق إلى ساعات + دقائق
      function formatTime(minutes) {
        const h = Math.floor(minutes / 60);
        const m = minutes % 60;
        if (minutes === 0) return "0 دقيقة";
        return `${h > 0 ? h + " ساعة و " : ""}${m} دقيقة`;
      }

      // عرض النتائج
      resultDiv.innerHTML = `
        ⏰ <strong>تأخر في الحضور:</strong> ${formatTime(lateMinutes)}<br>
        🏃‍♂️ <strong>انصراف مبكر:</strong> ${formatTime(earlyLeaveMinutes)}<br>
        📊 <strong>المجموع الكلي:</strong> ${formatTime(totalMinutes)} (${totalMinutes} دقيقة)
      `;

      resultDiv.style.display = 'block';
      resultDiv.style.background = '#e7f7e4';
      resultDiv.style.color = '#004400';
    });
  </script>

</body>
</html>
