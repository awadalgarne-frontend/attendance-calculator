<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاسبة التأخر والانصراف المبكر</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #74ebd5, #ACB6E5);
      font-family: "Tahoma", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }

    .card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 400px;
      margin-bottom: 20px;
    }

    .card-header {
      background: linear-gradient(135deg, #0078d7, #005fa3);
      color: white;
      border-radius: 20px 20px 0 0 !important;
      padding: 20px;
      text-align: center;
    }

    .btn-primary {
      background: linear-gradient(135deg, #0078d7, #005fa3);
      border: none;
      padding: 12px;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #005fa3, #004a7c);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 120, 215, 0.3);
    }

    .result-box {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
      line-height: 1.8;
      display: none;
      font-weight: 500;
      border-right: 4px solid #0078d7;
    }

    h2 {
      color: white;
      margin: 0;
    }

    .form-label {
      color: #333;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .form-control, .form-select {
      border-radius: 10px;
      padding: 10px 15px;
      border: 1px solid #ddd;
      transition: all 0.3s ease;
    }

    .form-control:focus, .form-select:focus {
      border-color: #0078d7;
      box-shadow: 0 0 0 0.25rem rgba(0, 120, 215, 0.25);
    }

    footer {
      text-align: center;
      color: #555;
      font-size: 0.9rem;
      padding: 15px;
      width: 100%;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
    }

    .footer-text {
      margin: 0;
    }

    .footer-name {
      color: #0078d7;
      font-weight: bold;
    }

    @media (max-width: 480px) {
      .card {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <h2><i class="far fa-clock me-2"></i>حاسبة التأخر والانصراف المبكر</h2>
    </div>
    <div class="card-body p-4">
      <form id="attendanceForm">
        
        <div class="mb-4">
          <label for="shift" class="form-label">نوع الدوام</label>
          <select id="shift" class="form-select">
            <option value="summer">الدوام الصيفي</option>
            <option value="winter">الدوام الشتوي</option>
          </select>
        </div>

        <div class="mb-4">
          <label class="form-label">زمن الحضور</label>
          <input type="time" id="arrival" class="form-control">
        </div>

        <div class="mb-4">
          <label class="form-label">زمن الانصراف</label>
          <input type="time" id="departure" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary w-100">
          <i class="fas fa-calculator me-2"></i>حساب النتيجة
        </button>

        <div id="result" class="result-box mt-4"></div>
      </form>
    </div>
  </div>

  <footer>
    <p class="footer-text">تم التصميم والبرمجة بواسطة <span class="footer-name">أ.عوض القرني</span></p>
  </footer>

  <script>
    document.getElementById('attendanceForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const shift = document.getElementById('shift').value;
      const arrival = document.getElementById('arrival').value;
      const departure = document.getElementById('departure').value;
      const resultDiv = document.getElementById('result');

      if (!arrival || !departure) {
        resultDiv.style.display = 'block';
        resultDiv.style.background = '#ffe5e5';
        resultDiv.style.color = '#b30000';
        resultDiv.innerHTML = '<i class="fas fa-exclamation-triangle me-2"></i>الرجاء إدخال زمن الحضور والانصراف.';
        return;
      }

      // الأوقات الرسمية
      let startTime, endTime;
      if (shift === 'summer') {
        startTime = "06:45";
        endTime = "13:15";
      } else {
        startTime = "07:15";
        endTime = "13:45";
      }

      // تحويل الوقت إلى دقائق
      function toMinutes(time) {
        const [h, m] = time.split(':').map(Number);
        return h * 60 + m;
      }

      const officialStart = toMinutes(startTime);
      const officialEnd = toMinutes(endTime);
      const actualStart = toMinutes(arrival);
      const actualEnd = toMinutes(departure);

      // حساب الدقائق
      const lateMinutes = Math.max(0, actualStart - officialStart);
      const earlyLeaveMinutes = Math.max(0, officialEnd - actualEnd);
      const totalMinutes = lateMinutes + earlyLeaveMinutes;

      // تحويل الدقائق إلى ساعات + دقائق
      function formatTime(minutes) {
        const h = Math.floor(minutes / 60);
        const m = minutes % 60;
        if (minutes === 0) return "0 دقيقة";
        return `${h > 0 ? h + " ساعة و " : ""}${m} دقيقة`;
      }

      // عرض النتائج
      resultDiv.innerHTML = `
        <div class="d-flex justify-content-between">
          <span><i class="fas fa-clock me-2"></i><strong>تأخر في الحضور:</strong></span>
          <span>${formatTime(lateMinutes)}</span>
        </div>
        <div class="d-flex justify-content-between">
          <span><i class="fas fa-running me-2"></i><strong>انصراف مبكر:</strong></span>
          <span>${formatTime(earlyLeaveMinutes)}</span>
        </div>
        <hr>
        <div class="d-flex justify-content-between">
          <span><i class="fas fa-chart-bar me-2"></i><strong>المجموع الكلي:</strong></span>
          <span>${formatTime(totalMinutes)}</span>
        </div>
        <div class="text-center mt-2 text-muted small">
          (${totalMinutes} دقيقة)
        </div>
      `;

      resultDiv.style.display = 'block';
      resultDiv.style.background = '#e7f7e4';
      resultDiv.style.color = '#004400';
    });
  </script>

</body>
</html>
