<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>طباعة تقرير الحضور والانصراف</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
  body {
    font-family: "Tahoma", sans-serif;
    background: linear-gradient(135deg, #6dd5ed, #2193b0);
    padding: 20px;
    min-height: 100vh;
  }

  .card {
    border-radius: 20px;
    background: #ffffff;
    box-shadow: 0 15px 35px rgba(0,0,0,0.15);
    border: none;
  }

  h3 {
    font-weight: bold;
    color: #004d69;
    letter-spacing: 1px;
  }

  label {
    color: #004d69;
    font-weight: bold;
  }

  table {
    border-radius: 12px;
    overflow: hidden;
  }

  table thead {
    background: linear-gradient(135deg, #0078d7, #005fa3);
    color: white;
  }

  table th {
    font-weight: bold;
    font-size: 14px;
    border: none !important;
  }

  table td {
    border-color: #e6eef3;
  }

  .table-bordered>:not(caption)>* {
    border-width: 1px;
  }

  input[type="time"] {
    border-radius: 8px;
    border: 1px solid #cce3f4;
    background: #f7fbff;
    transition: all 0.2s ease-in-out;
  }

  input[type="time"]:focus {
    border-color: #0078d7;
    box-shadow: 0 0 0 0.15rem rgba(0,120,215,0.2);
  }

  .btn-success {
    background: linear-gradient(135deg, #28a745, #1e7e34);
    border: none;
    font-weight: bold;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(40,167,69,0.3);
    transition: all 0.2s ease;
  }

  .btn-secondary {
    background: linear-gradient(135deg, #6c757d, #495057);
    border: none;
    font-weight: bold;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(108,117,125,0.3);
    transition: all 0.2s ease;
  }

  .btn-success:hover,
  .btn-secondary:hover {
    transform: translateY(-2px);
    opacity: 0.95;
  }

  .result {
    background: #f0fff4;
    border-radius: 8px;
    padding: 6px;
    font-size: 12px;
    color: #0f5132;
  }

  /* تحسين الطباعة */
  @media print {
    body {
      background: white !important;
    }

    .card {
      box-shadow: none;
      border-radius: 0;
    }

    button {
      display: none !important;
    }

    input[type="time"] {
      border: none !important;
      background: transparent !important;
      font-weight: bold;
      color: #000 !important;
    }

    table thead {
      background: #000 !important;
      color: #fff !important;
    }
  }
</style>

</head>
<body>

<div class="card p-4">
  <h3 class="text-center mb-3">تقرير الحضور والانصراف</h3>


  <div class="card shadow p-4 text-center" style="min-width:300px">
    <div id="dayName" class="fs-4 fw-bold mb-2">اليوم / </div>
    <div id="gregorianDate" class="text-primary fs-5">التاريخ / </div>
</div>
<br>
  <!-- أوقات الدوام -->
  <div class="row mb-3">
    <div class="col-md-6">
      <label class="fw-bold">بداية الدوام</label>
      <input type="time" id="workStart" class="form-control">
    </div>
    <div class="col-md-6">
      <label class="fw-bold">نهاية الدوام</label>
      <input type="time" id="workEnd" class="form-control">
    </div>
  </div>

  <!-- الجدول -->
  <form id="attendanceForm">
    <div class="table-responsive">
      <table class="table table-bordered">
        <thead class="table-dark">
          <tr>
            <th>اسم الموظف</th>
            <th>السجل المدني</th>
            <th>وقت الحضور</th>
            <th>وقت الانصراف</th>
            <th>النتيجة</th>
          </tr>
        </thead>
        <tbody id="employeesTable"></tbody>
      </table>
    </div>

    <div class="d-flex gap-2 mt-3">
      <button type="submit" class="btn btn-success w-50">حساب النتائج</button>
      <button type="button" onclick="window.print()" class="btn btn-secondary w-50">
        تحميل PDF
      </button>
    </div>
  </form>

  <div class="card text-center" style="margin-top: 20px; background:black; color:white; font-size:large">
    برمجة وتصميم أ.عوض القرني
  </div>
</div>


<script>
    const daysArabic = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];

    const today = new Date();

    // اسم اليوم
    const dayName = daysArabic[today.getDay()];

    // التاريخ الميلادي
    const gregorianFormatter = new Intl.DateTimeFormat('ar-SA', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
    });

    // التاريخ الهجري
    const hijriFormatter = new Intl.DateTimeFormat('ar-SA-u-ca-islamic', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
    });

    document.getElementById('dayName').innerText = dayName;
    document.getElementById('gregorianDate').innerText = '📆 ' + gregorianFormatter.format(today);
    document.getElementById('hijriDate').innerText = '🕌 ' + hijriFormatter.format(today);
</script>
<script>
// بيانات الموظفين
const employees = [
  {name:" موسى حسن محمد المظلمي	 ", id:"1055804395"},
  {name:" عبد الله محمد أحمد عسيري	 ", id:"1007184722"},
  {name:" علي محمد شعبان عسيري  ", id:"1043957768"},
  {name:" أحمد محمد علي العسيري ", id:"1021220874"},
  {name:" ابراهيم مغرم علي عسيري ", id:"1077699567"},
  {name:" ابراهيم علي ابراهيم عسيري ", id:"1064606591"},
  {name:" نايف محمد ابراهيم عسيري ", id:"1098053265"},
  {name:"  محمد علي عامر عسيري ", id:"1025841154"},
  {name:" احمد بن حشيش بن احمد آل المجنب ", id:"1049243130"},
  {name:" عبدالرحمن احمد صالح دخيخ ", id:"1057778241"},
  {name:"  عبدالرحمن محمد سعيد الشهراني", id:"1001612918"},
  {name:" حمود احمد محمد الهلالي ", id:"1023479510"},
  {name:" محمد علي محمد العاصمي ", id:"1020838031"},
  {name:" محمد يحيى امحمد ا لعاصمي عسيري ", id:"1019947264"},
  {name:" عبد الهادي بن محمد بن مفرح الثوابي ", id:"1078812722"},
  {name:"علي حسن علي عسيري  ", id:"1065925792"},
  {name:" أحمد بن عبد الله أحمد آل محمد ", id:"1029571237"},
  {name:" عوض حجر محمد القرني ", id:"1082631936"},
  {name:" عبدالمجيد لاحق مغرم عسيري ", id:"1084873957"},
  {name:" عبد المجيد عبد الله الحسن السرحاني ", id:"1079626436"},
  {name:" حسن احمد علي ال مرعي عسيري ", id:"1083046654"},
  {name:" زايد علي عبدالله ال الجرف ", id:"1058683382"},
  {name:" عبدالله احمد عيسى عسيري ", id:"1019720448"},
  {name:" علي يحي عيسي الماهسي عسيري ", id:"1018903557"},
  {name:" عيسى محمد علي عسيري ", id:"1048751901"}
];

// توليد الجدول
const tbody = document.getElementById("employeesTable");
employees.forEach(emp => {
  tbody.innerHTML += `
    <tr>
      <td>${emp.name}</td>
      <td>${emp.id}</td>
      <td><input type="time" class="form-control arrival"></td>
      <td><input type="time" class="form-control departure"></td>
      <td class="result fw-bold"></td>
    </tr>
  `;
});

// حساب النتائج
document.getElementById("attendanceForm").addEventListener("submit", function(e){
  e.preventDefault();

  const startTime = document.getElementById("workStart").value;
  const endTime   = document.getElementById("workEnd").value;

  if (!startTime || !endTime) {
    alert("حدد أوقات الدوام أولاً");
    return;
  }

  function toMinutes(t){
    const [h, m] = t.split(":").map(Number);
    return (h * 60) + m;
  }

  function formatTime(min){
    const h = Math.floor(min/60);
    const m = min % 60;
    return `${h>0? h+" ساعة ":""}${m} دقيقة`;
  }

  const start = toMinutes(startTime);
  const end   = toMinutes(endTime);

  document.querySelectorAll("tbody tr").forEach((row, i) => {
    const arr = row.querySelector(".arrival").value;
    const dep = row.querySelector(".departure").value;
    const cell = row.querySelector(".result");

    if (!arr || !dep) {
      cell.innerHTML = "بيانات ناقصة";
      return;
    }

    const a = toMinutes(arr);
    const d = toMinutes(dep);

    const late = Math.max(0, a - start);
    const early = Math.max(0, end - d);
    const total = late + early;
    const actualWork = Math.max(0, d - a);

    cell.innerHTML = `
      تأخر: ${formatTime(late)}<br>
      مبكر: ${formatTime(early)}<br>
      مجموع: ${formatTime(total)}<br>
      ساعات العمل: ${formatTime(actualWork)}
    `;
  });
});
</script>

</body>
</html>
